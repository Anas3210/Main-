<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Secret For You ✨</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for Aesthetic Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="scene">
    <!-- Light Bulb Area -->
    <div class="bulb-container">
      <div class="wire"></div>
      <div class="bulb" id="bulb">
        <div class="filament"></div>
      </div>
      <!-- Pull Cord Switch -->
      <div class="cord" id="cord">
        <div class="handle"></div>
      </div>
    </div>

    <!-- Door Background -->
    <div class="door">
      <div class="doorknob"></div>
    </div>
  </div>

  <!-- Romantic Letter Modal -->
  <div class="modal-overlay" id="letterModal">
    <div class="letter-card">
      <div class="heart-icon">💖</div>
      <h2>A Secret Gentle Reminder</h2>
      <p class="subtitle">Just a little note saved only for your eyes...</p>
      
      <div class="divider"></div>

      <div class="details">
        <div class="detail-item">
          <span class="label">📅 Date</span>
          <span class="value">17th August, 2026</span>
        </div>
        <div class="detail-item">
          <span class="label">⏰ Time</span>
          <span class="value">03:00 PM</span>
        </div>
        <div class="detail-item">
          <span class="label">📍 Location</span>
          <span class="value">Lapino</span>
        </div>
      </div>

      <p class="romantic-text">
        "Some moments are worth waiting for, and I can't wait to spend this one with you. Mark your calendar!" 🌸✨
      </p>

      <button class="close-btn" id="closeBtn">Keep it a secret 🤫</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
